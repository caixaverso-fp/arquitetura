# ============================================================================
#  Core Box — Stack de Observabilidade do Dia 04  (SOC do War Room)
#  Grafana (painel do War Room) + Loki (armazenamento de logs) + Promtail
#  (coletor) + Wazuh single-node (SIEM/detecção).
#
#  Uso em sala: 1 VM central roda esta stack. Cada VPS de grupo roda um
#  wazuh-agent e um promtail apontando para esta VM (ver README-observabilidade.md).
#  Para uma demonstração em um único host, suba tudo aqui e deixe o Core Box
#  gravando em ./logs-corebox (montado no promtail).
# ============================================================================
name: corebox-soc

services:
  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports: ["3100:3100"]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Monte aqui o diretório de logs do Core Box (BOX_LOG_DIR). Em sala, cada
      # grupo roda SEU promtail na VPS; aqui é para a demo em host único.
      - ./logs-corebox:/var/log/box:ro
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-warroom2026}
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # telão do War Room: leitura sem login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [loki]
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
