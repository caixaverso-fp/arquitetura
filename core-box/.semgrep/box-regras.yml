# Regras Semgrep PRÓPRIAS do Banco Box (GABARITO) — derivadas do Threat Model do Dia 01.
rules:
  - id: box-tm03-conta-origem-vinda-do-cliente
    languages: [python]
    severity: ERROR
    message: >-
      TM-03 (BOLA / CWE-639): a conta de origem não pode vir da requisição do cliente.
      Derive a conta a partir do usuário autenticado (g.usuario).
    metadata: {threat_model: TM-03, cwe: "CWE-639", owasp: "API1:2023"}
    pattern-either:
      - pattern: $DADOS.get("conta_origem", ...)
      - pattern: $DADOS["conta_origem"]
      - pattern: request.args.get("conta_origem", ...)

  - id: box-tm04-limite-override-do-cliente
    languages: [python]
    severity: ERROR
    message: >-
      TM-04 (CWE-602): limites de transação não podem ser ignorados por parâmetro enviado pelo cliente.
    metadata: {threat_model: TM-04, cwe: "CWE-602"}
    pattern-either:
      - pattern: $D.get("limite_override", ...)
      - pattern: $D["limite_override"]

  - id: box-tm06-log-com-token-ou-cpf
    languages: [python]
    severity: ERROR
    message: >-
      TM-06 (CWE-532): não registre tokens ou o cabeçalho Authorization em logs.
    metadata: {threat_model: TM-06, cwe: "CWE-532", lgpd: "art. 46"}
    patterns:
      - pattern-either:
          - pattern: $LOG.$M(..., <... request.headers.get("Authorization") ...>, ...)
          - pattern: $LOG.$M(..., <... request.cookies.get("box_token") ...>, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(debug|info|warning|error|critical|exception)$

  - id: box-tm06-log-com-campo-sensivel-no-texto
    languages: [python]
    severity: WARNING
    message: TM-06 — a mensagem de log cita token/senha/cpf. Confirme que o valor está mascarado.
    metadata: {threat_model: TM-06, cwe: "CWE-532"}
    patterns:
      - pattern: $LOG.$M("$MSG", ...)
      - metavariable-regex:
          metavariable: $MSG
          regex: (?i).*(token|senha|auth=|cpf=|codigo).*
      - metavariable-regex:
          metavariable: $M
          regex: ^(debug|info|warning|error|critical)$

  - id: box-tm23-mensagem-revela-cliente
    languages: [python]
    severity: WARNING
    message: >-
      TM-23 (CWE-204): a mensagem revela se o CPF é cliente. Use mensagem única ("CPF ou senha inválidos").
    metadata: {threat_model: TM-23, cwe: "CWE-204"}
    pattern-regex: (?i)(não|nao) cadastrado no Banco Box

  - id: box-tm12-hash-rapido-para-senha
    languages: [python]
    severity: ERROR
    message: TM-12 (CWE-916) — use KDF lenta com salt (scrypt/argon2/pbkdf2) para senhas.
    metadata: {threat_model: TM-12, cwe: "CWE-916"}
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
